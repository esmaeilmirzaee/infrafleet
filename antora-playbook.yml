site:
  title: Production Docs
  url: https://example.com
  start_page: component-a::index.adoc
content:
  sources:
    # - url: https://github.com
    # branches: [main, v1.0]
    # start_path: docs
    - url: https://github.com/esmaeilmirzaee/infrafleet.git
      branches: main
      start_path: docs
asciidoc:
  extensions:
    - asciidoctor-kroki
  attributes:
    source-highlighter: rouge
    rouge-style: github
    icons: font
    sectnums: true
antora:
  extensions:
    - "@antora/lunr-extension"
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
output:
  dir: ./build/site
